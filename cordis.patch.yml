# Bundle patch layer: one host row for the knowledge base itself.
#
# The entry id doubles as the plugin's settings namespace. `enabled: false`
# keeps the package installed while switching the tools off.
#
# dbPath 留空时落在 $DSH_HOME/kb/kb.db —— 与会话文件同域，迁移备份一起走。
#
# ui 关掉只停 /api/dsh-kb/*（面板随之打不开）；工具与系统提示不受影响。
# 行 id 是设置命名空间（面板 id 也用它），name 才是模块名。
#
# mirrorDir 留空 = 库旁边的 mirror/：Markdown 镜像跟着库一起备份、一起迁移。
- insert:
    - id: dsh-kb
      name: "@myremme/dsh-kb"
      config:
        enabled: true
        dbPath: ""
        maxResults: 6
        promptSection: true
        ui: true
        bootFacts: 6
        ingestEveryMinutes: 0
        staleDays: 30
        mirrorDir: ""
